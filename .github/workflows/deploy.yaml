name: Build and Deploy
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: sirpi/ai-wind-file-validator-backend:latest

      - name: Install Vault
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install -y vault

      - name: Retrieve .env from Vault
        run: |
          vault login -address="${{ secrets.VAULT_ADDR }}" ${{ secrets.VAULT_TOKEN }}
          vault kv get -address="${{ secrets.VAULT_ADDR }}" -field=credentials kv/projects/ai-wind-file-validator > /tmp/.env
          chmod 600 /tmp/.env

      - name: Copy .env to server
        run: |
          echo "${{ secrets.SERVER_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          scp -i /tmp/ssh_key \
            -o StrictHostKeyChecking=no \
            -P ${{ secrets.SERVER_PORT }} \
            /tmp/.env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/.env

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull sirpi/ai-wind-file-validator-backend:latest
            docker stop ai-wind-file-validator-backend || true
            docker rm ai-wind-file-validator-backend || true
            docker run -d \
              --name ai-wind-file-validator-backend \
              -p 4749:8000 \
              --restart unless-stopped \
              --env-file /tmp/.env \
              sirpi/ai-wind-file-validator-backend:latest
            rm -f /tmp/.env
